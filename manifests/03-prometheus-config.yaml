apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alert.rules

    scrape_configs:
      - job_name: 'blackbox-http'
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            - http://sre-web-service.default.svc.cluster.local:80
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-service:9115

  alert.rules: |
    groups:
      - name: SRE_SLO_Rules
        rules:
          # SLI: Son 5 dakikadaki Kullanılabilirlik Oranı
          - record: job:probe_success:availability_ratio_5m
            expr: sum_over_time(probe_success[5m]) / count_over_time(probe_success[5m])

          # SLO Alarmı: Hedef %95
          - alert: WebAppSLOBreach
            expr: job:probe_success:availability_ratio_5m < 0.95
            for: 30s
            labels:
              severity: warning
              tier: platform-sre
            annotations:
              summary: "SLO İhlali: Web Servisi Kullanılabilirliği Düştü!"
              description: "Son 5 dakikadaki kullanılabilirlik %{{ $value | humanizePercentage }} seviyesine indi (Hedef: %95)."
