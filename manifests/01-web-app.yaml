apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-web-target
  labels:
    app: sre-web-target
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-web-target
  template:
    metadata:
      labels:
        app: sre-web-target
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sre-web-service
spec:
  selector:
    app: sre-web-target
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sre-web-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sre-web-target
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
